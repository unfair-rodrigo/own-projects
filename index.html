<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d14; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; }
    textarea, input, button { font-family: 'Inter', system-ui, sans-serif; }
    input:focus, textarea:focus { outline: none; }
    textarea { resize: vertical; }
    ::-webkit-scrollbar { width: 4px; } 
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3f; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }

    /* Mobile: single column */
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; }
      #layout { flex-direction: column !important; height: auto !important; }
      #sidebar { width: 100% !important; height: auto !important; border-right: none !important; border-bottom: 1px solid #2a2a3f !important; flex-direction: row !important; padding: 10px !important; gap: 0 !important; }
      #sidebar-nav { flex-direction: row !important; gap: 4px !important; flex: 1 !important; }
      #sidebar-footer { display: none !important; }
      #sidebar-logo { display: none !important; }
      #main { height: auto !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useCallback, useRef, useEffect } = React;

  // ─── STORAGE ───────────────────────────────────────────────────────────────
  const STORAGE_KEY = "mi_sistema_v3";
  const todayKey = () => new Date().toISOString().slice(0, 10);

  const defaultState = () => ({
    objective: "Leer 24 libros este año y aplicar lo aprendido",
    micro: { label: "Conseguir clientes y generar $10,000", goal: 10000, earned: 3200 },
    habits: [
      { id: 1, name: "Ejercicio", icon: "⚡" },
      { id: 2, name: "Meditación", icon: "🧘" },
      { id: 3, name: "Lectura 30 min", icon: "📖" },
      { id: 4, name: "Sin celular al despertar", icon: "📵" },
      { id: 5, name: "Outreach / clientes", icon: "🎯" },
      { id: 6, name: "Trabajo profundo", icon: "🔥" },
      { id: 7, name: "Dormir antes de las 10pm", icon: "🌙" },
    ],
    clients: [
      { id: "c1", name: "Julian Traumatología", color: "#f59e0b" },
      { id: "c2", name: "Scan Medic", color: "#06b6d4" },
    ],
    clientTasks: {},
    personalTasks: [],
    dailyLogs: {},
  });

  function load() {
    try {
      const r = localStorage.getItem(STORAGE_KEY);
      if (r) {
        const p = JSON.parse(r), d = defaultState();
        return { ...d, ...p, clients: p.clients||d.clients, clientTasks: p.clientTasks||{}, personalTasks: p.personalTasks||[] };
      }
    } catch {}
    return defaultState();
  }
  function save(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} }

  // ─── HELPERS ───────────────────────────────────────────────────────────────
  function getLast7(logs, habitId) {
    const days = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(); d.setDate(d.getDate() - (6 - i));
      const k = d.toISOString().slice(0, 10);
      return { key: k, done: logs[k]?.done?.includes(habitId) ?? false, label: days[d.getDay()], isToday: k === todayKey() };
    });
  }
  function getStreak(logs, habitId) {
    let count = 0;
    for (let i = 0; i < 60; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = d.toISOString().slice(0, 10);
      if (logs[k]?.done?.includes(habitId)) count++;
      else if (i > 0) break;
    }
    return count;
  }

  // ─── COLORS ────────────────────────────────────────────────────────────────
  const C = {
    bg: "#0d0d14", sidebar: "#0f0f1a", surface: "#13131f", surface2: "#1a1a2e",
    border: "#2a2a3f", border2: "#3a3a5a",
    text: "#e8e8f0", muted: "#606090", muted2: "#9090b8",
    accent: "#8b5cf6", accentDim: "rgba(139,92,246,0.12)", accentGlow: "rgba(139,92,246,0.25)",
    green: "#22c55e", amber: "#f59e0b", red: "#ef4444", cyan: "#06b6d4",
  };
  const card = (extra={}) => ({ background: C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px", marginBottom:8, ...extra });
  const lbl = { fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:C.muted, marginBottom:8, display:"block" };
  const inp = { fontSize:13, padding:"7px 10px", borderRadius:7, border:`1px solid ${C.border2}`, background:C.surface2, color:C.text, width:"100%" };
  const btnA = { padding:"6px 14px", borderRadius:7, border:"none", background:C.accent, color:"#fff", cursor:"pointer", fontSize:13, fontWeight:500 };
  const btnG = { padding:"6px 14px", borderRadius:7, border:`1px solid ${C.border}`, background:"transparent", color:C.muted, cursor:"pointer", fontSize:13 };

  // ─── RADAR ─────────────────────────────────────────────────────────────────
  function RadarChart({ habits, logs, size=220 }) {
    const cx=size/2, cy=size/2, r=size*0.37, n=habits.length;
    if (n < 3) return null;
    const scores = habits.map(h => getLast7(logs, h.id).filter(d=>d.done).length / 7);
    const angle = i => Math.PI*2*i/n - Math.PI/2;
    const pt = (i, rad) => ({ x: cx+rad*Math.cos(angle(i)), y: cy+rad*Math.sin(angle(i)) });
    const dataPath = scores.map((s,i)=>{ const p=pt(i,s*r); return `${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(" ")+" Z";
    const avg = scores.reduce((a,b)=>a+b,0)/n;
    return (
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
        <svg width={size} height={size} style={{ overflow:"visible" }}>
          {[0.25,0.5,0.75,1].map((ring,ri) => {
            const path = habits.map((_,i)=>{ const p=pt(i,ring*r); return `${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(" ")+" Z";
            return <path key={ri} d={path} fill="none" stroke={ri===3?"#3a3a4a":"#222230"} strokeWidth={ri===3?1:0.5}/>;
          })}
          {habits.map((_,i)=>{ const p=pt(i,r); return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#2a2a3a" strokeWidth={0.5}/>; })}
          <path d={dataPath} fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" strokeWidth={1.5} strokeLinejoin="round"/>
          {scores.map((s,i)=>{ const p=pt(i,s*r); return <circle key={i} cx={p.x} cy={p.y} r={3} fill="#8b5cf6" stroke="#0d0d14" strokeWidth={1.5}/>; })}
          {habits.map((h,i)=>{ const p=pt(i,r+20); const anchor=p.x<cx-5?"end":p.x>cx+5?"start":"middle"; return <text key={i} x={p.x} y={p.y} textAnchor={anchor} dominantBaseline="middle" style={{fontSize:11,fill:"#8080a8"}}>{h.icon}</text>; })}
        </svg>
        <div style={{ fontSize:11, color:C.accent, marginTop:-4 }}>{Math.round(avg*100)}% consistencia</div>
      </div>
    );
  }

  // ─── SUB-COMPONENTS ────────────────────────────────────────────────────────
  function HabitInput({ onAdd, onCancel }) {
    const [val, setVal] = useState("");
    const ref = useRef(null);
    useEffect(() => { ref.current?.focus({ preventScroll:true }); }, []);
    const submit = () => { if (!val.trim()) return; onAdd(val.trim()); setVal(""); };
    return (
      <div style={{ display:"flex", gap:6, marginTop:8 }}>
        <input ref={ref} value={val} onChange={e=>setVal(e.target.value)} placeholder="Nombre del hábito..."
          onKeyDown={e=>{ if(e.key==="Enter") submit(); if(e.key==="Escape") onCancel(); }}
          style={{ ...inp, flex:1 }} />
        <button onClick={submit} style={btnA}>✓</button>
        <button onClick={onCancel} style={btnG}>✕</button>
      </div>
    );
  }

  function TaskItem({ task, onToggle, onRemove, accent }) {
    return (
      <div style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderBottom:`1px solid ${C.border}` }}>
        <button onClick={onToggle} style={{ width:18,height:18,borderRadius:"50%",flexShrink:0,cursor:"pointer",border:`1.5px solid ${task.done?(accent||C.accent):C.border2}`,background:task.done?(accent||C.accent):"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}>
          {task.done && <span style={{ color:"#fff",fontSize:9,fontWeight:700 }}>✓</span>}
        </button>
        <span style={{ fontSize:13,color:task.done?C.muted:C.text,flex:1,textDecoration:task.done?"line-through":"none",transition:"all 0.15s" }}>
          {task.carry&&!task.done && <span style={{ fontSize:10,color:C.amber,marginRight:4 }}>↩</span>}
          {task.text}
        </span>
        <button onClick={onRemove} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15,lineHeight:1,padding:"0 2px" }}>×</button>
      </div>
    );
  }

  function AddTaskInline({ onAdd, accent }) {
    const [val, setVal] = useState("");
    const [open, setOpen] = useState(false);
    const ref = useRef(null);
    useEffect(() => { if (open) ref.current?.focus({ preventScroll:true }); }, [open]);
    const submit = () => { if (!val.trim()) return; onAdd(val.trim()); setVal(""); setOpen(false); };
    if (!open) return <button onClick={()=>setOpen(true)} style={{ display:"flex",alignItems:"center",gap:4,marginTop:6,fontSize:12,color:accent||C.accent,background:"transparent",border:"none",cursor:"pointer" }}>＋ Agregar tarea</button>;
    return (
      <div style={{ display:"flex",gap:6,marginTop:8 }}>
        <input ref={ref} value={val} onChange={e=>setVal(e.target.value)} placeholder="Nueva tarea..."
          onKeyDown={e=>{ if(e.key==="Enter") submit(); if(e.key==="Escape") setOpen(false); }}
          style={{ ...inp, flex:1 }} />
        <button onClick={submit} style={{ ...btnA, background:accent||C.accent }}>✓</button>
        <button onClick={()=>setOpen(false)} style={btnG}>✕</button>
      </div>
    );
  }

  // ─── MAIN APP ──────────────────────────────────────────────────────────────
  function App() {
    const [state, setState] = useState(load);
    const [tab, setTab] = useState("today");
    const [oodaOpen, setOodaOpen] = useState(false);
    const [addingHabit, setAddingHabit] = useState(false);
    const [editingObj, setEditingObj] = useState(false);
    const [editingMicro, setEditingMicro] = useState(false);
    const [tempObj, setTempObj] = useState("");
    const [tempMicro, setTempMicro] = useState({ label:"", goal:"", earned:"" });
    const [newClientName, setNewClientName] = useState("");
    const [addingClient, setAddingClient] = useState(false);
    const addClientRef = useRef(null);
    useEffect(() => { if (addingClient) addClientRef.current?.focus({ preventScroll:true }); }, [addingClient]);

    const update = useCallback(fn => setState(prev => { const next=fn(prev); save(next); return next; }), []);

    const tk = todayKey();
    const log = state.dailyLogs[tk] || { done:[], ooda:{}, reflect1:"", reflect2:"" };
    const updateLog = patch => update(prev => ({
      ...prev,
      dailyLogs: { ...prev.dailyLogs, [tk]: { ...(prev.dailyLogs[tk]||{done:[],ooda:{},reflect1:"",reflect2:""}), ...patch } }
    }));

    const toggleHabit = id => updateLog({ done: log.done.includes(id) ? log.done.filter(x=>x!==id) : [...log.done, id] });

    const getClientTasks = id => state.clientTasks[id] || [];
    const addClientTask = (cid, text) => update(prev => ({ ...prev, clientTasks: { ...prev.clientTasks, [cid]: [...(prev.clientTasks[cid]||[]), {id:Date.now(),text,done:false,carry:false}] } }));
    const toggleClientTask = (cid, tid) => update(prev => ({ ...prev, clientTasks: { ...prev.clientTasks, [cid]: (prev.clientTasks[cid]||[]).map(t=>t.id===tid?{...t,done:!t.done}:t) } }));
    const removeClientTask = (cid, tid) => update(prev => ({ ...prev, clientTasks: { ...prev.clientTasks, [cid]: (prev.clientTasks[cid]||[]).filter(t=>t.id!==tid) } }));
    const addClient = () => {
      if (!newClientName.trim()) return;
      const colors = ["#f59e0b","#06b6d4","#8b5cf6","#22c55e","#ef4444","#f97316","#ec4899"];
      update(prev => ({ ...prev, clients: [...prev.clients, {id:"c"+Date.now(), name:newClientName.trim(), color:colors[prev.clients.length%colors.length]}] }));
      setNewClientName(""); setAddingClient(false);
    };
    const removeClient = id => update(prev => { const ct={...prev.clientTasks}; delete ct[id]; return {...prev, clients:prev.clients.filter(c=>c.id!==id), clientTasks:ct}; });
    const addPersonalTask = text => update(prev => ({ ...prev, personalTasks: [...prev.personalTasks, {id:Date.now(),text,done:false,carry:false}] }));
    const togglePersonalTask = id => update(prev => ({ ...prev, personalTasks: prev.personalTasks.map(t=>t.id===id?{...t,done:!t.done}:t) }));
    const removePersonalTask = id => update(prev => ({ ...prev, personalTasks: prev.personalTasks.filter(t=>t.id!==id) }));

    const doneCount = log.done.length;
    const totalH = state.habits.length;
    const pct = totalH ? Math.round(doneCount/totalH*100) : 0;
    const microPct = Math.min(100, Math.round(state.micro.earned/state.micro.goal*100));
    const totalTasks = state.clients.reduce((s,c)=>s+getClientTasks(c.id).length,0) + state.personalTasks.length;
    const doneTasks = state.clients.reduce((s,c)=>s+getClientTasks(c.id).filter(t=>t.done).length,0) + state.personalTasks.filter(t=>t.done).length;

    // ── SIDEBAR ───────────────────────────────────────────────────────────────
    const navItems = [
      { id:"today",   icon:"◈", label:"Hoy",      badge: `${pct}%` },
      { id:"tasks",   icon:"◧", label:"Tareas",   badge: totalTasks>0?`${doneTasks}/${totalTasks}`:null },
      { id:"progress",icon:"◆", label:"Progreso", badge: null },
      { id:"settings",icon:"◎", label:"Config",   badge: null },
    ];

    const Sidebar = () => (
      <div id="sidebar" style={{ width:200, flexShrink:0, background:C.sidebar, borderRight:`1px solid ${C.border}`, display:"flex", flexDirection:"column", height:"100vh", padding:"20px 12px", gap:0, overflow:"hidden" }}>
        <div id="sidebar-logo" style={{ marginBottom:24, paddingLeft:8 }}>
          <div style={{ fontSize:15, fontWeight:700, color:C.text, letterSpacing:"0.04em" }}>MI SISTEMA</div>
          <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>
            {new Date().toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"}).toUpperCase()}
          </div>
        </div>

        {/* Micro progress compact */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:9, padding:"10px 12px", marginBottom:16 }}>
          <div style={{ fontSize:10, color:C.muted, marginBottom:4, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Microobjetivo</div>
          <div style={{ fontSize:18, fontWeight:700, color:C.cyan, letterSpacing:"-0.02em", marginBottom:6 }}>${state.micro.earned.toLocaleString()}</div>
          <div style={{ height:4, background:C.surface2, borderRadius:99, overflow:"hidden", marginBottom:4 }}>
            <div style={{ width:`${microPct}%`, height:"100%", background:`linear-gradient(90deg,${C.cyan},#818cf8)`, borderRadius:99, transition:"width 0.5s" }}/>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:C.muted }}>
            <span>{microPct}% logrado</span>
            <span>${(state.micro.goal-state.micro.earned).toLocaleString()} restante</span>
          </div>
        </div>

        {/* Habits mini progress */}
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:9, padding:"10px 12px", marginBottom:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
            <div style={{ fontSize:10, color:C.muted, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Hábitos hoy</div>
            <span style={{ fontSize:11, color:pct===100?C.green:C.muted }}>{doneCount}/{totalH}</span>
          </div>
          <div style={{ height:4, background:C.surface2, borderRadius:99, overflow:"hidden" }}>
            <div style={{ width:`${pct}%`, height:"100%", background:pct===100?C.green:C.accent, borderRadius:99, transition:"width 0.3s" }}/>
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginTop:8 }}>
            {state.habits.map(h => {
              const done = log.done.includes(h.id);
              return (
                <button key={h.id} onClick={()=>toggleHabit(h.id)} title={h.name}
                  style={{ width:28, height:28, borderRadius:7, border:`1px solid ${done?"rgba(139,92,246,0.5)":C.border}`, background:done?C.accentDim:"transparent", cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.15s" }}>
                  {h.icon}
                </button>
              );
            })}
          </div>
        </div>

        {/* Nav */}
        <div id="sidebar-nav" style={{ display:"flex", flexDirection:"column", gap:2 }}>
          {navItems.map(n => (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{
              display:"flex", alignItems:"center", gap:9, padding:"9px 10px", borderRadius:8,
              border:"none", cursor:"pointer", textAlign:"left", transition:"all 0.15s",
              background: tab===n.id ? C.accentDim : "transparent",
              color: tab===n.id ? C.accent : C.muted2,
            }}>
              <span style={{ fontSize:13 }}>{n.icon}</span>
              <span style={{ fontSize:13, fontWeight: tab===n.id?600:400, flex:1 }}>{n.label}</span>
              {n.badge && <span style={{ fontSize:10, padding:"1px 6px", borderRadius:99, background:tab===n.id?C.accentDim:C.surface2, color:tab===n.id?C.accent:C.muted }}>{n.badge}</span>}
            </button>
          ))}
        </div>

        {/* Sidebar footer: objetivo */}
        <div id="sidebar-footer" style={{ marginTop:"auto", paddingTop:16, borderTop:`1px solid ${C.border}` }}>
          <div style={{ fontSize:9, color:C.muted, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:5 }}>Objetivo</div>
          <p style={{ fontSize:11, color:C.muted2, lineHeight:1.5, margin:0 }}>{state.objective}</p>
        </div>
      </div>
    );

    // ── TODAY TAB ─────────────────────────────────────────────────────────────
    const renderTodayTab = () => (
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, alignItems:"start" }}>

        {/* LEFT COLUMN */}
        <div>
          {/* Objetivo */}
          <div style={{ ...card(), borderLeft:`2px solid ${C.accent}` }}>
            <span style={lbl}>◈ Objetivo largo plazo</span>
            {editingObj ? (
              <div style={{ display:"flex", gap:7 }}>
                <input value={tempObj} onChange={e=>setTempObj(e.target.value)} autoFocus
                  onKeyDown={e=>{ if(e.key==="Enter"){ update(p=>({...p,objective:tempObj})); setEditingObj(false); } }}
                  style={{ ...inp, flex:1 }} />
                <button onClick={()=>{ update(p=>({...p,objective:tempObj})); setEditingObj(false); }} style={btnA}>✓</button>
              </div>
            ) : (
              <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                <p style={{ fontSize:13, fontWeight:500, color:C.text, margin:0, lineHeight:1.6 }}>{state.objective}</p>
                <button onClick={()=>{ setTempObj(state.objective); setEditingObj(true); }} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15,flexShrink:0 }}>✎</button>
              </div>
            )}
          </div>

          {/* Microobjetivo */}
          <div style={{ ...card(), borderLeft:`2px solid ${C.cyan}` }}>
            <span style={lbl}>◎ Microobjetivo — este mes</span>
            {editingMicro ? (
              <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                <input placeholder="Descripción" value={tempMicro.label} onChange={e=>setTempMicro(p=>({...p,label:e.target.value}))} style={inp}/>
                <div style={{ display:"flex", gap:7 }}>
                  <input placeholder="Meta $" value={tempMicro.goal} onChange={e=>setTempMicro(p=>({...p,goal:e.target.value}))} type="number" style={inp}/>
                  <input placeholder="Ganado $" value={tempMicro.earned} onChange={e=>setTempMicro(p=>({...p,earned:e.target.value}))} type="number" style={inp}/>
                </div>
                <div style={{ display:"flex", gap:7 }}>
                  <button onClick={()=>{ update(p=>({...p,micro:{label:tempMicro.label,goal:+tempMicro.goal,earned:+tempMicro.earned}})); setEditingMicro(false); }} style={{ ...btnA, background:C.cyan, color:"#000", flex:1 }}>Guardar</button>
                  <button onClick={()=>setEditingMicro(false)} style={btnG}>✕</button>
                </div>
              </div>
            ) : (
              <>
                <div style={{ display:"flex", justifyContent:"space-between", gap:8, marginBottom:10 }}>
                  <p style={{ fontSize:13, fontWeight:500, color:C.text, margin:0 }}>{state.micro.label}</p>
                  <button onClick={()=>{ setTempMicro({label:state.micro.label,goal:String(state.micro.goal),earned:String(state.micro.earned)}); setEditingMicro(true); }} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15,flexShrink:0 }}>✎</button>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:8 }}>
                  <span style={{ fontSize:26, fontWeight:700, color:C.cyan, letterSpacing:"-0.02em" }}>${state.micro.earned.toLocaleString()}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.muted, marginBottom:4 }}>
                      <span>meta: ${state.micro.goal.toLocaleString()}</span>
                      <span style={{ color:C.cyan }}>{microPct}%</span>
                    </div>
                    <div style={{ height:6, background:C.surface2, borderRadius:99, overflow:"hidden" }}>
                      <div style={{ width:`${microPct}%`, height:"100%", background:`linear-gradient(90deg,${C.cyan},#818cf8)`, borderRadius:99, transition:"width 0.6s" }}/>
                    </div>
                  </div>
                </div>
                <div style={{ fontSize:11, color:C.muted }}>
                  Faltan <strong style={{ color:C.text }}>${(state.micro.goal-state.micro.earned).toLocaleString()}</strong> · {30-new Date().getDate()} días restantes
                </div>
              </>
            )}
          </div>

          {/* Hábitos */}
          <div style={card()}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
              <span style={{ ...lbl, marginBottom:0 }}>◆ Hábitos de hoy</span>
              <span style={{ fontSize:11, color:pct===100?C.green:C.muted }}>{doneCount}/{totalH} · {pct}%</span>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
              {state.habits.map(h => {
                const done = log.done.includes(h.id);
                const streak = getStreak(state.dailyLogs, h.id);
                return (
                  <button key={h.id} onClick={()=>toggleHabit(h.id)} style={{ display:"flex",alignItems:"center",gap:7,padding:"8px 10px",borderRadius:8,border:`1px solid ${done?"rgba(139,92,246,0.4)":C.border}`,background:done?C.accentDim:"transparent",cursor:"pointer",textAlign:"left",transition:"all 0.15s" }}>
                    <div style={{ width:16,height:16,borderRadius:"50%",flexShrink:0,border:`1.5px solid ${done?C.accent:C.border2}`,background:done?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}>
                      {done && <span style={{ color:"#fff",fontSize:9,fontWeight:700 }}>✓</span>}
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12,color:done?C.text:C.muted,fontWeight:done?500:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{h.icon} {h.name}</div>
                      {streak>1 && <div style={{ fontSize:9,color:C.accent,marginTop:1 }}>🔥 {streak}d</div>}
                    </div>
                  </button>
                );
              })}
            </div>
            {addingHabit ? (
              <HabitInput onAdd={text=>{ update(p=>({...p,habits:[...p.habits,{id:Date.now(),name:text,icon:"✅"}]})); setAddingHabit(false); }} onCancel={()=>setAddingHabit(false)}/>
            ) : (
              <button onClick={()=>setAddingHabit(true)} style={{ display:"flex",alignItems:"center",gap:4,marginTop:8,fontSize:11,color:C.muted,background:"transparent",border:"none",cursor:"pointer" }}>＋ Agregar hábito</button>
            )}
          </div>
        </div>

        {/* RIGHT COLUMN */}
        <div>
          {/* OODA */}
          <div style={card()}>
            <button onClick={()=>setOodaOpen(p=>!p)} style={{ width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:"transparent",border:"none",cursor:"pointer",padding:0 }}>
              <div style={{ textAlign:"left" }}>
                <span style={lbl}>⟳ OODA — si algo no funciona</span>
                <p style={{ fontSize:12,color:oodaOpen?C.accent:C.muted,margin:0 }}>{oodaOpen?"Revisando estrategia":"Activar si algo no está funcionando"}</p>
              </div>
              <span style={{ fontSize:10,padding:"2px 8px",borderRadius:99,background:oodaOpen?C.accentDim:C.surface2,color:oodaOpen?C.accent:C.muted,border:`1px solid ${oodaOpen?C.accent+"40":C.border}`,marginLeft:8,flexShrink:0 }}>
                {oodaOpen?"Activo":"No hoy"}
              </span>
            </button>
            {oodaOpen && (
              <div style={{ marginTop:12 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  {[
                    { key:"observe", tag:"O", title:"Observar", q:"¿Qué está pasando? (hechos)" },
                    { key:"orient",  tag:"O", title:"Orientar",  q:"¿Por qué está pasando?" },
                    { key:"decide",  tag:"D", title:"Decidir",   q:"¿Qué voy a cambiar?" },
                    { key:"act",     tag:"A", title:"Actuar",    q:"Acción concreta mañana" },
                  ].map(step => (
                    <div key={step.key}>
                      <div style={{ fontSize:9,fontWeight:700,color:C.accent,letterSpacing:"0.1em",marginBottom:3 }}>{step.tag} — {step.title.toUpperCase()}</div>
                      <div style={{ fontSize:10,color:C.muted,marginBottom:4 }}>{step.q}</div>
                      <textarea value={log.ooda?.[step.key]||""} onChange={e=>updateLog({ooda:{...(log.ooda||{}),[step.key]:e.target.value}})}
                        placeholder="Escribe..." rows={2} style={{ ...inp, resize:"none", fontSize:12 }}/>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Reflexión */}
          <div style={card()}>
            <span style={lbl}>◉ Reflexión nocturna — 2 min</span>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              {[
                { key:"reflect1", q:"¿Lo más importante que hice hoy?" },
                { key:"reflect2", q:"¿Qué ajusto mañana?" },
              ].map(f => (
                <div key={f.key}>
                  <div style={{ fontSize:11,color:C.muted,marginBottom:4 }}>{f.q}</div>
                  <textarea value={log[f.key]||""} onChange={e=>updateLog({[f.key]:e.target.value})}
                    placeholder="Una línea..." rows={3} style={{ ...inp, resize:"none", fontSize:12 }}/>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );

    // ── TASKS TAB ─────────────────────────────────────────────────────────────
    const renderTasksTab = () => {
      return (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, alignItems:"start" }}>

          {/* LEFT: Preguntas + clientes */}
          <div>
            <div style={{ ...card(), borderLeft:`2px solid ${C.amber}`, background:"rgba(245,158,11,0.04)" }}>
              <span style={{ ...lbl, color:C.amber }}>🧠 Preguntas antes de empezar</span>
              <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                {[
                  "¿Qué hago solo para convencerme de que estoy trabajando?",
                  "¿Qué hago solo para perder el tiempo?",
                  "¿Qué hago solo para verme bien frente al universo?",
                  "¿Qué producirá más valor para mí o mis clientes?",
                ].map((q,i) => (
                  <div key={i} style={{ display:"flex", gap:8 }}>
                    <span style={{ fontSize:11,color:C.amber,fontWeight:700,flexShrink:0 }}>{i+1}.</span>
                    <span style={{ fontSize:12,color:C.text,lineHeight:1.5 }}>{q}</span>
                  </div>
                ))}
              </div>
            </div>

            {totalTasks > 0 && (
              <div style={card()}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:7 }}>
                  <span style={{ ...lbl, marginBottom:0 }}>◆ Progreso del día</span>
                  <span style={{ fontSize:11, color:doneTasks===totalTasks?C.green:C.muted }}>{doneTasks}/{totalTasks}</span>
                </div>
                <div style={{ height:5,background:C.surface2,borderRadius:99,overflow:"hidden" }}>
                  <div style={{ width:`${Math.round(doneTasks/totalTasks*100)}%`,height:"100%",background:doneTasks===totalTasks?C.green:C.accent,borderRadius:99,transition:"width 0.4s" }}/>
                </div>
              </div>
            )}

            {state.clients.map(client => {
              const tasks = getClientTasks(client.id);
              const pending = tasks.filter(t=>!t.done).length;
              return (
                <div key={client.id} style={{ ...card(), borderLeft:`2px solid ${client.color}` }}>
                  <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8 }}>
                    <div style={{ display:"flex",alignItems:"center",gap:7 }}>
                      <div style={{ width:7,height:7,borderRadius:"50%",background:client.color }}/>
                      <span style={{ fontSize:13,fontWeight:600,color:C.text }}>{client.name}</span>
                      {pending>0 && <span style={{ fontSize:10,padding:"1px 6px",borderRadius:99,background:`${client.color}20`,color:client.color,border:`1px solid ${client.color}40` }}>{pending}</span>}
                      {pending===0&&tasks.length>0 && <span style={{ fontSize:10,color:C.green }}>✓</span>}
                    </div>
                    <button onClick={()=>removeClient(client.id)} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:14,opacity:0.5 }}>×</button>
                  </div>
                  {tasks.length===0 && <p style={{ fontSize:12,color:C.muted,marginBottom:4 }}>Sin tareas</p>}
                  {tasks.map(t => <TaskItem key={t.id} task={t} accent={client.color} onToggle={()=>toggleClientTask(client.id,t.id)} onRemove={()=>removeClientTask(client.id,t.id)}/>)}
                  <AddTaskInline onAdd={text=>addClientTask(client.id,text)} accent={client.color}/>
                </div>
              );
            })}

            <div style={{ ...card(), borderStyle:"dashed" }}>
              {addingClient ? (
                <div style={{ display:"flex", gap:6 }}>
                  <input ref={addClientRef} value={newClientName} onChange={e=>setNewClientName(e.target.value)}
                    placeholder="Nombre del cliente..." onKeyDown={e=>{ if(e.key==="Enter") addClient(); if(e.key==="Escape") setAddingClient(false); }}
                    style={{ ...inp, flex:1 }}/>
                  <button onClick={addClient} style={btnA}>✓</button>
                  <button onClick={()=>setAddingClient(false)} style={btnG}>✕</button>
                </div>
              ) : (
                <button onClick={()=>setAddingClient(true)} style={{ display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.muted,background:"transparent",border:"none",cursor:"pointer",width:"100%",justifyContent:"center" }}>
                  ＋ Agregar cliente
                </button>
              )}
            </div>
          </div>

          {/* RIGHT: Tareas propias + nota */}
          <div>
            <div style={{ ...card(), borderLeft:`2px solid ${C.accent}` }}>
              <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10 }}>
                <span style={{ fontSize:13,fontWeight:600,color:C.text }}>👤 Tareas propias</span>
                {state.personalTasks.filter(t=>!t.done).length>0 && (
                  <span style={{ fontSize:10,padding:"1px 6px",borderRadius:99,background:"rgba(139,92,246,0.12)",color:C.accent,border:`1px solid rgba(139,92,246,0.25)` }}>
                    {state.personalTasks.filter(t=>!t.done).length} pendientes
                  </span>
                )}
              </div>
              {state.personalTasks.length===0 && <p style={{ fontSize:12,color:C.muted,marginBottom:4 }}>Sin tareas personales</p>}
              {state.personalTasks.map(t => <TaskItem key={t.id} task={t} accent={C.accent} onToggle={()=>togglePersonalTask(t.id)} onRemove={()=>removePersonalTask(t.id)}/>)}
              <AddTaskInline onAdd={addPersonalTask} accent={C.accent}/>
            </div>

            <div style={{ padding:"12px 14px", background:"rgba(139,92,246,0.05)", borderRadius:9, border:`1px solid rgba(139,92,246,0.12)` }}>
              <p style={{ fontSize:12,color:C.muted,margin:0,lineHeight:1.7 }}>
                🌙 <strong style={{ color:C.accent }}>Ritual nocturno:</strong> Cada noche revisa esta lista. Completa lo que puedas. Si algo lleva 2+ días sin hacerse, pregúntate si realmente importa.
              </p>
            </div>
          </div>
        </div>
      );
    };

    // ── PROGRESS TAB ──────────────────────────────────────────────────────────
    const renderProgressTab = () => {
      const dayLabels = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
      return (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, alignItems:"start" }}>

          {/* LEFT */}
          <div>
            <div style={{ ...card(), display:"flex", flexDirection:"column", alignItems:"center" }}>
              <span style={{ ...lbl, alignSelf:"flex-start" }}>◈ Radar — últimos 7 días</span>
              <RadarChart habits={state.habits} logs={state.dailyLogs} size={200}/>
              <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginTop:10, justifyContent:"center" }}>
                {state.habits.map(h => {
                  const rate = Math.round(getLast7(state.dailyLogs,h.id).filter(d=>d.done).length/7*100);
                  return (
                    <div key={h.id} style={{ display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.muted,background:C.surface2,padding:"2px 7px",borderRadius:99,border:`1px solid ${C.border}` }}>
                      {h.icon} <span style={{ color:rate>50?C.accent:C.muted }}>{rate}%</span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={card()}>
              <span style={lbl}>◎ Microobjetivo</span>
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
                <span style={{ fontSize:28,fontWeight:700,color:C.cyan,letterSpacing:"-0.03em" }}>{microPct}%</span>
                <div style={{ flex:1 }}>
                  <div style={{ height:8,background:C.surface2,borderRadius:99,overflow:"hidden" }}>
                    <div style={{ width:`${microPct}%`,height:"100%",background:`linear-gradient(90deg,${C.cyan},${C.accent})`,borderRadius:99,transition:"width 0.6s" }}/>
                  </div>
                  <div style={{ display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,marginTop:4 }}>
                    <span>${state.micro.earned.toLocaleString()} ganados</span>
                    <span>meta ${state.micro.goal.toLocaleString()}</span>
                  </div>
                </div>
              </div>
              <div style={{ padding:"8px 12px",background:C.surface2,borderRadius:8,border:`1px solid ${C.border}` }}>
                <div style={{ fontSize:10,color:C.muted,marginBottom:3 }}>Para cumplir la meta</div>
                <div style={{ fontSize:18,fontWeight:700,color:C.text }}>${(state.micro.goal-state.micro.earned).toLocaleString()}</div>
                <div style={{ fontSize:10,color:C.muted,marginTop:2 }}>~${Math.round((state.micro.goal-state.micro.earned)/Math.max(1,30-new Date().getDate())).toLocaleString()}/día restante</div>
              </div>
            </div>
          </div>

          {/* RIGHT */}
          <div>
            <div style={card()}>
              <span style={lbl}>◆ Detalle por hábito</span>
              {state.habits.map(h => {
                const week = getLast7(state.dailyLogs, h.id);
                const rate = week.filter(d=>d.done).length/7;
                const streak = getStreak(state.dailyLogs, h.id);
                return (
                  <div key={h.id} style={{ marginBottom:12 }}>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4 }}>
                      <span style={{ fontSize:12,color:C.text }}>{h.icon} {h.name}</span>
                      <div style={{ display:"flex",alignItems:"center",gap:7 }}>
                        {streak>0 && <span style={{ fontSize:10,color:C.accent }}>🔥 {streak}d</span>}
                        <span style={{ fontSize:11,color:rate>0.5?C.accent:C.muted }}>{Math.round(rate*100)}%</span>
                      </div>
                    </div>
                    <div style={{ height:4,background:C.surface2,borderRadius:99,overflow:"hidden",marginBottom:4 }}>
                      <div style={{ width:`${rate*100}%`,height:"100%",background:rate>0.7?C.accent:rate>0.4?C.amber:C.red,borderRadius:99,transition:"width 0.5s" }}/>
                    </div>
                    <div style={{ display:"flex", gap:3 }}>
                      {week.map((d,i) => (
                        <div key={i} style={{ flex:1, textAlign:"center" }}>
                          <div style={{ height:18,borderRadius:4,background:d.done?C.accentDim:C.surface2,border:`1px solid ${d.done?C.accent+"50":C.border}`,display:"flex",alignItems:"center",justifyContent:"center" }}>
                            {d.done && <span style={{ fontSize:8,color:C.accent }}>✓</span>}
                          </div>
                          <div style={{ fontSize:8,color:C.muted,marginTop:1 }}>{dayLabels[new Date(d.key+"T12:00:00").getDay()]}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>

            <div style={card()}>
              <span style={lbl}>◉ Historial de reflexiones</span>
              {Object.entries(state.dailyLogs).filter(([,v])=>v.reflect1||v.reflect2).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6).map(([k,v]) => (
                <div key={k} style={{ marginBottom:9,paddingBottom:9,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ fontSize:10,color:C.muted,marginBottom:3 }}>{k}</div>
                  {v.reflect1 && <p style={{ fontSize:12,color:C.text,margin:"0 0 2px" }}>✅ {v.reflect1}</p>}
                  {v.reflect2 && <p style={{ fontSize:12,color:C.muted,margin:0 }}>🔄 {v.reflect2}</p>}
                </div>
              ))}
              {!Object.values(state.dailyLogs).some(v=>v.reflect1||v.reflect2) && <p style={{ fontSize:12,color:C.muted }}>Aún sin reflexiones.</p>}
            </div>
          </div>
        </div>
      );
    };

    // ── SETTINGS TAB ──────────────────────────────────────────────────────────
    const renderSettingsTab = () => (
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, alignItems:"start" }}>
        <div>
          <div style={card()}>
            <span style={lbl}>◆ Hábitos activos</span>
            {state.habits.map(h => (
              <div key={h.id} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}` }}>
                <span style={{ fontSize:13 }}>{h.icon} {h.name}</span>
                <button onClick={()=>update(p=>({...p,habits:p.habits.filter(x=>x.id!==h.id)}))} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15 }}>×</button>
              </div>
            ))}
            {addingHabit ? (
              <HabitInput onAdd={text=>{ update(p=>({...p,habits:[...p.habits,{id:Date.now(),name:text,icon:"✅"}]})); setAddingHabit(false); }} onCancel={()=>setAddingHabit(false)}/>
            ) : (
              <button onClick={()=>setAddingHabit(true)} style={{ display:"flex",alignItems:"center",gap:4,marginTop:8,fontSize:12,color:C.accent,background:"transparent",border:"none",cursor:"pointer" }}>＋ Agregar hábito</button>
            )}
          </div>
        </div>
        <div>
          <div style={card()}>
            <span style={lbl}>⚠ Zona peligrosa</span>
            <p style={{ fontSize:12,color:C.muted,marginBottom:10 }}>Esto borrará todos tus datos guardados: hábitos, tareas, progreso y reflexiones.</p>
            <button onClick={()=>{ if(window.confirm("¿Resetear todos los datos? Esta acción no se puede deshacer.")){ const d=defaultState(); save(d); setState(d); } }}
              style={{ fontSize:13,padding:"7px 14px",borderRadius:7,border:`1px solid rgba(239,68,68,0.3)`,background:"rgba(239,68,68,0.08)",color:"#ef4444",cursor:"pointer" }}>
              Resetear todos los datos
            </button>
          </div>
        </div>
      </div>
    );

    // ── RENDER ─────────────────────────────────────────────────────────────────
    const tabTitles = { today:"Hoy", tasks:"Tareas", progress:"Progreso", settings:"Configuración" };

    return (
      <div id="layout" style={{ display:"flex", height:"100vh", background:C.bg, color:C.text, fontFamily:"'Inter', system-ui, sans-serif" }}>
        <Sidebar/>
        <div id="main" style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
          {/* Top bar */}
          <div style={{ borderBottom:`1px solid ${C.border}`, padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0 }}>
            <div>
              <h1 style={{ fontSize:16,fontWeight:600,color:C.text,margin:0 }}>{tabTitles[tab]}</h1>
              <div style={{ fontSize:11,color:C.muted,marginTop:1 }}>
                {new Date().toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase()}
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <div style={{ width:7,height:7,borderRadius:"50%",background:pct===100?C.green:C.accent,boxShadow:`0 0 7px ${pct===100?C.green:C.accent}` }}/>
              <span style={{ fontSize:11,color:C.muted }}>{pct}% hábitos completados</span>
            </div>
          </div>

          {/* Scrollable content */}
          <div style={{ flex:1, overflowY:"auto", padding:"16px 24px" }}>
            {tab==="today" && renderTodayTab()}
            {tab==="tasks" && renderTasksTab()}
            {tab==="progress" && renderProgressTab()}
            {tab==="settings" && renderSettingsTab()}
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
