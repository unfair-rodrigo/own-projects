<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d14; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; }
    textarea, input, button, select { font-family: 'Inter', system-ui, sans-serif; }
    input:focus, textarea:focus, select:focus { outline: none; }
    textarea { resize: vertical; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3f; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }
    .drag-item { transition: opacity 0.15s, transform 0.15s; }
    .drag-item.dragging { opacity: 0.35; transform: scale(0.98); }
    .drag-item.drag-over { border-top: 2px solid #8b5cf6 !important; }
    @keyframes slideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .slide-in { animation: slideIn 0.2s ease forwards; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal-bg { animation: fadeIn 0.15s ease; }
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; }
      #layout { flex-direction: column !important; height: auto !important; }
      #sidebar { width: 100% !important; height: auto !important; border-right: none !important; border-bottom: 1px solid #2a2a3f !important; flex-direction: row !important; padding: 10px !important; gap: 0 !important; }
      #sidebar-nav { flex-direction: row !important; gap: 4px !important; flex: 1 !important; }
      #sidebar-footer { display: none !important; }
      #sidebar-logo { display: none !important; }
      #main { height: auto !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useCallback, useRef, useEffect, useMemo } = React;

  const STORAGE_KEY = "mi_sistema_v5";
  const todayKey = () => new Date().toISOString().slice(0, 10);

  const defaultState = () => ({
    objective: "Lograr facturar 100,000 soles al mes",
    micro: { label: "Conseguir clientes y generar $10,000", goal: 10000, earned: 3200 },
    habits: [
      { id: 1, name: "Ejercicio", icon: "⚡" },
      { id: 2, name: "Meditación", icon: "🧘" },
      { id: 3, name: "Lectura 30 min", icon: "📖" },
      { id: 4, name: "Sin celular al despertar", icon: "📵" },
      { id: 5, name: "Outreach / clientes", icon: "🎯" },
      { id: 6, name: "Trabajo profundo", icon: "🔥" },
      { id: 7, name: "Dormir antes de las 10pm", icon: "🌙" },
    ],
    clients: [
      { id: "c1", name: "Julian Traumatología", color: "#f59e0b" },
      { id: "c2", name: "Scan Medic", color: "#06b6d4" },
    ],
    clientTasks: {},
    personalTasks: [],
    dailyLogs: {},
    priorityOrder: [],
  });

  function load() {
    try {
      const r = localStorage.getItem(STORAGE_KEY);
      // Also try to migrate from v3/v4
      const r_old = !r && (localStorage.getItem("mi_sistema_v3") || localStorage.getItem("mi_sistema_v4"));
      const raw = r || r_old;
      if (raw) {
        const p = JSON.parse(raw), d = defaultState();
        return { ...d, ...p, clients: p.clients||d.clients, clientTasks: p.clientTasks||{}, personalTasks: p.personalTasks||[], priorityOrder: p.priorityOrder||[] };
      }
    } catch {}
    return defaultState();
  }
  function save(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} }

  function getLast7(logs, habitId) {
    const days = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(); d.setDate(d.getDate() - (6 - i));
      const k = d.toISOString().slice(0, 10);
      return { key: k, done: logs[k]?.done?.includes(habitId) ?? false, label: days[d.getDay()], isToday: k === todayKey() };
    });
  }
  function getStreak(logs, habitId) {
    let count = 0;
    for (let i = 0; i < 60; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = d.toISOString().slice(0, 10);
      if (logs[k]?.done?.includes(habitId)) count++;
      else if (i > 0) break;
    }
    return count;
  }

  // Time helpers
  function timeToMinutes(t) {
    if (!t) return null;
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }
  function minutesToTime(m) {
    const h = Math.floor(m / 60) % 24;
    const min = m % 60;
    return `${String(h).padStart(2,"0")}:${String(min).padStart(2,"0")}`;
  }
  function formatTime12(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "pm" : "am";
    const h12 = h % 12 || 12;
    return `${h12}:${String(m).padStart(2,"0")}${ampm}`;
  }
  function formatDateShort(d) {
    if (!d) return "";
    const [y, mo, day] = d.split("-");
    const months = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${parseInt(day)} ${months[parseInt(mo)-1]}`;
  }

  const C = {
    bg: "#0d0d14", sidebar: "#0f0f1a", surface: "#13131f", surface2: "#1a1a2e",
    border: "#2a2a3f", border2: "#3a3a5a",
    text: "#e8e8f0", muted: "#606090", muted2: "#9090b8",
    accent: "#8b5cf6", accentDim: "rgba(139,92,246,0.12)", accentGlow: "rgba(139,92,246,0.25)",
    green: "#22c55e", amber: "#f59e0b", red: "#ef4444", cyan: "#06b6d4",
    modal: "#161622",
  };
  const card = (extra={}) => ({ background: C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px", marginBottom:8, ...extra });
  const lbl = { fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:C.muted, marginBottom:8, display:"block" };
  const inp = { fontSize:13, padding:"7px 10px", borderRadius:7, border:`1px solid ${C.border2}`, background:C.surface2, color:C.text, width:"100%" };
  const btnA = { padding:"6px 14px", borderRadius:7, border:"none", background:C.accent, color:"#fff", cursor:"pointer", fontSize:13, fontWeight:500 };
  const btnG = { padding:"6px 14px", borderRadius:7, border:`1px solid ${C.border}`, background:"transparent", color:C.muted, cursor:"pointer", fontSize:13 };

  // ─── TASK SCHEDULE MODAL ───────────────────────────────────────────────────
  function TaskScheduleModal({ task, onSave, onClose }) {
    const [date, setDate] = useState(task.date || "");
    const [timeStart, setTimeStart] = useState(task.timeStart || "");
    const [timeEnd, setTimeEnd] = useState(task.timeEnd || "");
    const [repeat, setRepeat] = useState(task.repeat || "none"); // "none" | "daily"

    const handleSave = () => {
      onSave({ date, timeStart, timeEnd, repeat });
      onClose();
    };

    return (
      <div className="modal-bg" style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }}
        onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
        <div style={{ background:C.modal, border:`1px solid ${C.border2}`, borderRadius:14, padding:24, width:360, boxShadow:"0 24px 60px rgba(0,0,0,0.6)" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:600, color:C.text }}>Programar tarea</div>
              <div style={{ fontSize:11, color:C.muted, marginTop:2, maxWidth:260, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{task.text}</div>
            </div>
            <button onClick={onClose} style={{ background:"transparent", border:"none", cursor:"pointer", color:C.muted, fontSize:20, lineHeight:1, padding:"0 4px" }}>×</button>
          </div>

          {/* Date */}
          <div style={{ marginBottom:14 }}>
            <label style={{ fontSize:11, color:C.muted, display:"block", marginBottom:5, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Fecha (opcional)</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}
              style={{ ...inp, colorScheme:"dark" }}/>
            {date && <button onClick={()=>setDate("")} style={{ marginTop:5, fontSize:10, color:C.muted, background:"transparent", border:"none", cursor:"pointer" }}>× quitar fecha</button>}
          </div>

          {/* Time */}
          <div style={{ marginBottom:14 }}>
            <label style={{ fontSize:11, color:C.muted, display:"block", marginBottom:5, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Horario (opcional)</label>
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              <input type="time" value={timeStart} onChange={e=>setTimeStart(e.target.value)}
                style={{ ...inp, colorScheme:"dark", flex:1 }} placeholder="Inicio"/>
              <span style={{ color:C.muted, fontSize:12 }}>→</span>
              <input type="time" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)}
                style={{ ...inp, colorScheme:"dark", flex:1 }} placeholder="Fin"/>
            </div>
            {(timeStart||timeEnd) && <button onClick={()=>{setTimeStart(""); setTimeEnd("");}} style={{ marginTop:5, fontSize:10, color:C.muted, background:"transparent", border:"none", cursor:"pointer" }}>× quitar horario</button>}
          </div>

          {/* Repeat */}
          <div style={{ marginBottom:20 }}>
            <label style={{ fontSize:11, color:C.muted, display:"block", marginBottom:5, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Repetición</label>
            <div style={{ display:"flex", gap:6 }}>
              {[{v:"none",l:"Sin repetir"},{v:"daily",l:"Todos los días"}].map(opt => (
                <button key={opt.v} onClick={()=>setRepeat(opt.v)}
                  style={{ flex:1, padding:"7px 10px", borderRadius:8, border:`1px solid ${repeat===opt.v?C.accent:C.border}`, background:repeat===opt.v?C.accentDim:"transparent", color:repeat===opt.v?C.accent:C.muted, cursor:"pointer", fontSize:12, fontWeight:repeat===opt.v?600:400, transition:"all 0.15s" }}>
                  {opt.l}
                </button>
              ))}
            </div>
          </div>

          <div style={{ display:"flex", gap:8 }}>
            <button onClick={handleSave} style={{ ...btnA, flex:1, padding:"9px 0", fontSize:13 }}>Guardar</button>
            <button onClick={onClose} style={{ ...btnG, flex:1, padding:"9px 0", fontSize:13 }}>Cancelar</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── ADD TASK INLINE WITH SCHEDULE ────────────────────────────────────────
  function AddTaskInline({ onAdd, accent }) {
    const [val, setVal] = useState("");
    const [open, setOpen] = useState(false);
    const [showSchedule, setShowSchedule] = useState(false);
    const [date, setDate] = useState("");
    const [timeStart, setTimeStart] = useState("");
    const [timeEnd, setTimeEnd] = useState("");
    const [repeat, setRepeat] = useState("none");
    const ref = useRef(null);
    useEffect(() => { if (open) ref.current?.focus({ preventScroll:true }); }, [open]);

    const submit = () => {
      if (!val.trim()) return;
      onAdd(val.trim(), { date, timeStart, timeEnd, repeat });
      setVal(""); setDate(""); setTimeStart(""); setTimeEnd(""); setRepeat("none");
      setOpen(false); setShowSchedule(false);
    };

    if (!open) return <button onClick={()=>setOpen(true)} style={{ display:"flex",alignItems:"center",gap:4,marginTop:6,fontSize:12,color:accent||C.accent,background:"transparent",border:"none",cursor:"pointer" }}>＋ Agregar tarea</button>;

    return (
      <div style={{ marginTop:8 }}>
        <div style={{ display:"flex",gap:6 }}>
          <input ref={ref} value={val} onChange={e=>setVal(e.target.value)} placeholder="Nueva tarea..."
            onKeyDown={e=>{ if(e.key==="Enter") submit(); if(e.key==="Escape") setOpen(false); }}
            style={{ ...inp, flex:1 }} />
          <button onClick={submit} style={{ ...btnA, background:accent||C.accent }}>✓</button>
          <button onClick={()=>setOpen(false)} style={btnG}>✕</button>
        </div>
        {/* Schedule toggle */}
        <button onClick={()=>setShowSchedule(p=>!p)} style={{ display:"flex",alignItems:"center",gap:4,marginTop:5,fontSize:11,color:showSchedule?C.accent:C.muted,background:"transparent",border:"none",cursor:"pointer" }}>
          🕐 {showSchedule?"Ocultar horario":"+ Agregar horario (opcional)"}
        </button>
        {showSchedule && (
          <div style={{ marginTop:8, padding:"10px 12px", background:C.surface2, borderRadius:8, border:`1px solid ${C.border}` }}>
            <div style={{ display:"flex", gap:8, marginBottom:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:C.muted, marginBottom:4 }}>Fecha</div>
                <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{ ...inp, fontSize:12, colorScheme:"dark" }}/>
              </div>
            </div>
            <div style={{ display:"flex", gap:6, alignItems:"center", marginBottom:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:C.muted, marginBottom:4 }}>Inicio</div>
                <input type="time" value={timeStart} onChange={e=>setTimeStart(e.target.value)} style={{ ...inp, fontSize:12, colorScheme:"dark" }}/>
              </div>
              <span style={{ color:C.muted, fontSize:11, marginTop:16 }}>→</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:C.muted, marginBottom:4 }}>Fin</div>
                <input type="time" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)} style={{ ...inp, fontSize:12, colorScheme:"dark" }}/>
              </div>
            </div>
            <div style={{ display:"flex", gap:5 }}>
              {[{v:"none",l:"Sin repetir"},{v:"daily",l:"🔁 Todos los días"}].map(opt => (
                <button key={opt.v} onClick={()=>setRepeat(opt.v)}
                  style={{ flex:1, padding:"5px 8px", borderRadius:7, border:`1px solid ${repeat===opt.v?C.accent:C.border}`, background:repeat===opt.v?C.accentDim:"transparent", color:repeat===opt.v?C.accent:C.muted, cursor:"pointer", fontSize:11, transition:"all 0.15s" }}>
                  {opt.l}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  // ─── TASK ITEM ─────────────────────────────────────────────────────────────
  function TaskItem({ task, onToggle, onRemove, onSchedule, accent }) {
    const hasTime = task.timeStart;
    const hasDate = task.date;
    return (
      <div style={{ display:"flex", alignItems:"flex-start", gap:8, padding:"7px 0", borderBottom:`1px solid ${C.border}` }}>
        <button onClick={onToggle} style={{ width:18,height:18,borderRadius:"50%",flexShrink:0,cursor:"pointer",border:`1.5px solid ${task.done?(accent||C.accent):C.border2}`,background:task.done?(accent||C.accent):"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s",marginTop:2 }}>
          {task.done && <span style={{ color:"#fff",fontSize:9,fontWeight:700 }}>✓</span>}
        </button>
        <div style={{ flex:1, minWidth:0 }}>
          <span style={{ fontSize:13,color:task.done?C.muted:C.text,textDecoration:task.done?"line-through":"none",transition:"all 0.15s",display:"block" }}>
            {task.carry&&!task.done && <span style={{ fontSize:10,color:C.amber,marginRight:4 }}>↩</span>}
            {task.text}
          </span>
          {(hasDate || hasTime || task.repeat==="daily") && (
            <div style={{ display:"flex", alignItems:"center", gap:5, marginTop:3, flexWrap:"wrap" }}>
              {task.repeat==="daily" && <span style={{ fontSize:9, padding:"1px 5px", borderRadius:99, background:"rgba(139,92,246,0.12)", color:C.accent, border:`1px solid rgba(139,92,246,0.2)` }}>🔁 diario</span>}
              {hasDate && task.repeat!=="daily" && <span style={{ fontSize:10, color:C.muted }}>{formatDateShort(task.date)}</span>}
              {hasTime && <span style={{ fontSize:10, color:accent||C.accent }}>{formatTime12(task.timeStart)}{task.timeEnd?" – "+formatTime12(task.timeEnd):""}</span>}
            </div>
          )}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:2, flexShrink:0 }}>
          <button onClick={onSchedule} title="Programar" style={{ background:"transparent",border:"none",cursor:"pointer",color:hasTime||hasDate?accent||C.accent:C.muted,fontSize:12,lineHeight:1,padding:"2px 3px",opacity:hasTime||hasDate?1:0.5 }}>🕐</button>
          <button onClick={onRemove} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15,lineHeight:1,padding:"0 2px" }}>×</button>
        </div>
      </div>
    );
  }

  // ─── RADAR CHART ──────────────────────────────────────────────────────────
  function RadarChart({ habits, logs, size=220 }) {
    const cx=size/2, cy=size/2, r=size*0.37, n=habits.length;
    if (n < 3) return null;
    const scores = habits.map(h => getLast7(logs, h.id).filter(d=>d.done).length / 7);
    const angle = i => Math.PI*2*i/n - Math.PI/2;
    const pt = (i, rad) => ({ x: cx+rad*Math.cos(angle(i)), y: cy+rad*Math.sin(angle(i)) });
    const dataPath = scores.map((s,i)=>{ const p=pt(i,s*r); return `${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(" ")+" Z";
    const avg = scores.reduce((a,b)=>a+b,0)/n;
    return (
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
        <svg width={size} height={size} style={{ overflow:"visible" }}>
          {[0.25,0.5,0.75,1].map((ring,ri) => {
            const path = habits.map((_,i)=>{ const p=pt(i,ring*r); return `${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(" ")+" Z";
            return <path key={ri} d={path} fill="none" stroke={ri===3?"#3a3a4a":"#222230"} strokeWidth={ri===3?1:0.5}/>;
          })}
          {habits.map((_,i)=>{ const p=pt(i,r); return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#2a2a3a" strokeWidth={0.5}/>; })}
          <path d={dataPath} fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" strokeWidth={1.5} strokeLinejoin="round"/>
          {scores.map((s,i)=>{ const p=pt(i,s*r); return <circle key={i} cx={p.x} cy={p.y} r={3} fill="#8b5cf6" stroke="#0d0d14" strokeWidth={1.5}/>; })}
          {habits.map((h,i)=>{ const p=pt(i,r+20); const anchor=p.x<cx-5?"end":p.x>cx+5?"start":"middle"; return <text key={i} x={p.x} y={p.y} textAnchor={anchor} dominantBaseline="middle" style={{fontSize:11,fill:"#8080a8"}}>{h.icon}</text>; })}
        </svg>
        <div style={{ fontSize:11, color:C.accent, marginTop:-4 }}>{Math.round(avg*100)}% consistencia</div>
      </div>
    );
  }

  // ─── HABIT INPUT ──────────────────────────────────────────────────────────
  function HabitInput({ onAdd, onCancel }) {
    const [val, setVal] = useState("");
    const ref = useRef(null);
    useEffect(() => { ref.current?.focus({ preventScroll:true }); }, []);
    const submit = () => { if (!val.trim()) return; onAdd(val.trim()); setVal(""); };
    return (
      <div style={{ display:"flex", gap:6, marginTop:8 }}>
        <input ref={ref} value={val} onChange={e=>setVal(e.target.value)} placeholder="Nombre del hábito..."
          onKeyDown={e=>{ if(e.key==="Enter") submit(); if(e.key==="Escape") onCancel(); }}
          style={{ ...inp, flex:1 }} />
        <button onClick={submit} style={btnA}>✓</button>
        <button onClick={onCancel} style={btnG}>✕</button>
      </div>
    );
  }

  // ─── CALENDAR VIEW ────────────────────────────────────────────────────────
  function CalendarView({ state, getClientTasks, toggleClientTask, togglePersonalTask }) {
    const [calDate, setCalDate] = useState(new Date());

    // Get week days (Mon-Sun) for the current week
    const getWeekDays = (d) => {
      const start = new Date(d);
      const day = start.getDay();
      const diff = day === 0 ? -6 : 1 - day; // Monday start
      start.setDate(start.getDate() + diff);
      return Array.from({length:7}, (_,i) => {
        const dd = new Date(start);
        dd.setDate(start.getDate() + i);
        return dd;
      });
    };

    const weekDays = getWeekDays(calDate);
    const weekDayLabels = ["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"];

    const prevWeek = () => { const d=new Date(calDate); d.setDate(d.getDate()-7); setCalDate(d); };
    const nextWeek = () => { const d=new Date(calDate); d.setDate(d.getDate()+7); setCalDate(d); };
    const goToday = () => setCalDate(new Date());

    // Collect all tasks with time info
    const allScheduledTasks = useMemo(() => {
      const tasks = [];
      state.clients.forEach(client => {
        (state.clientTasks[client.id]||[]).forEach(t => {
          if (t.timeStart || t.repeat === "daily") {
            tasks.push({ ...t, source:"client", clientId:client.id, clientName:client.name, color:client.color });
          }
        });
      });
      state.personalTasks.forEach(t => {
        if (t.timeStart || t.repeat === "daily") {
          tasks.push({ ...t, source:"personal", color:C.accent, clientName:"Personal" });
        }
      });
      return tasks;
    }, [state]);

    // Get tasks for a specific day
    const getTasksForDay = (dayDate) => {
      const dk = dayDate.toISOString().slice(0,10);
      return allScheduledTasks.filter(t => {
        if (t.repeat === "daily") return true; // show every day
        return t.date === dk;
      });
    };

    // Hours to show: 4am to 11pm
    const START_HOUR = 4;
    const END_HOUR = 23;
    const TOTAL_HOURS = END_HOUR - START_HOUR;
    const HOUR_HEIGHT = 60; // px per hour
    const TOTAL_HEIGHT = TOTAL_HOURS * HOUR_HEIGHT;
    const COL_WIDTH = 110;

    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const nowOffset = (nowMinutes - START_HOUR * 60) / 60 * HOUR_HEIGHT;

    const todayStr = todayKey();

    return (
      <div className="slide-in">
        {/* Calendar header nav */}
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <button onClick={prevWeek} style={{ ...btnG, padding:"5px 10px" }}>‹</button>
          <button onClick={goToday} style={{ ...btnG, padding:"5px 12px", fontSize:12 }}>Hoy</button>
          <button onClick={nextWeek} style={{ ...btnG, padding:"5px 10px" }}>›</button>
          <span style={{ fontSize:13, color:C.text, fontWeight:600 }}>
            {weekDays[0].toLocaleDateString("es-PE",{day:"numeric",month:"short"})} – {weekDays[6].toLocaleDateString("es-PE",{day:"numeric",month:"short",year:"numeric"})}
          </span>
        </div>

        {/* Calendar grid */}
        <div style={{ display:"flex", background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, overflow:"hidden" }}>
          {/* Time gutter */}
          <div style={{ width:52, flexShrink:0, borderRight:`1px solid ${C.border}` }}>
            <div style={{ height:40, borderBottom:`1px solid ${C.border}` }}/> {/* header spacer */}
            <div style={{ position:"relative", height:TOTAL_HEIGHT }}>
              {Array.from({length:TOTAL_HOURS+1}, (_,i) => (
                <div key={i} style={{ position:"absolute", top: i * HOUR_HEIGHT - 7, left:0, right:0, textAlign:"right", paddingRight:8, fontSize:10, color:C.muted, userSelect:"none" }}>
                  {i+START_HOUR < 12 ? `${i+START_HOUR} AM` : i+START_HOUR === 12 ? "12 PM" : `${i+START_HOUR-12} PM`}
                </div>
              ))}
            </div>
          </div>

          {/* Days */}
          <div style={{ flex:1, overflowX:"auto", display:"flex" }}>
            {weekDays.map((day, di) => {
              const dk = day.toISOString().slice(0,10);
              const isToday = dk === todayStr;
              const dayTasks = getTasksForDay(day);

              return (
                <div key={di} style={{ flex:1, minWidth:COL_WIDTH, borderRight: di<6?`1px solid ${C.border}`:"none" }}>
                  {/* Day header */}
                  <div style={{ height:40, borderBottom:`1px solid ${C.border}`, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:1 }}>
                    <div style={{ fontSize:9, color:isToday?C.accent:C.muted, fontWeight:700, letterSpacing:"0.06em" }}>{weekDayLabels[di]}</div>
                    <div style={{ fontSize:15, fontWeight:700, color:isToday?C.accent:C.text, width:26, height:26, display:"flex", alignItems:"center", justifyContent:"center", borderRadius:"50%", background:isToday?C.accentDim:"transparent" }}>
                      {day.getDate()}
                    </div>
                  </div>

                  {/* Events area */}
                  <div style={{ position:"relative", height:TOTAL_HEIGHT }}>
                    {/* Hour grid lines */}
                    {Array.from({length:TOTAL_HOURS}, (_,i) => (
                      <div key={i} style={{ position:"absolute", top: i * HOUR_HEIGHT, left:0, right:0, borderTop:`1px solid ${C.border}`, opacity:0.4 }}/>
                    ))}
                    {/* Half hour lines */}
                    {Array.from({length:TOTAL_HOURS}, (_,i) => (
                      <div key={"h"+i} style={{ position:"absolute", top: i * HOUR_HEIGHT + HOUR_HEIGHT/2, left:0, right:0, borderTop:`1px dashed ${C.border}`, opacity:0.2 }}/>
                    ))}

                    {/* Current time line */}
                    {isToday && nowOffset >= 0 && nowOffset <= TOTAL_HEIGHT && (
                      <div style={{ position:"absolute", top: nowOffset, left:0, right:0, zIndex:10, display:"flex", alignItems:"center" }}>
                        <div style={{ width:7, height:7, borderRadius:"50%", background:C.red, flexShrink:0, marginLeft:-3 }}/>
                        <div style={{ flex:1, height:1, background:C.red }}/>
                      </div>
                    )}

                    {/* Tasks */}
                    {dayTasks.map((task, ti) => {
                      const startMin = timeToMinutes(task.timeStart) || (8*60); // default 8am
                      const endMin = timeToMinutes(task.timeEnd) || (startMin + 60);
                      const duration = endMin - startMin;
                      const top = (startMin - START_HOUR*60) / 60 * HOUR_HEIGHT;
                      const height = Math.max(24, duration / 60 * HOUR_HEIGHT - 2);

                      if (top < 0 || top > TOTAL_HEIGHT) return null;

                      const toggle = task.source==="client"
                        ? ()=>toggleClientTask(task.clientId, task.id)
                        : ()=>togglePersonalTask(task.id);

                      return (
                        <div key={task.id+"_"+di} onClick={toggle}
                          style={{
                            position:"absolute", top, left:3, right:3,
                            height, borderRadius:6,
                            background:`${task.color}22`,
                            border:`1.5px solid ${task.color}80`,
                            borderLeft:`3px solid ${task.color}`,
                            padding:"3px 5px", cursor:"pointer", overflow:"hidden",
                            opacity: task.done ? 0.45 : 1,
                            zIndex: 5,
                          }}>
                          <div style={{ fontSize:10, fontWeight:600, color:task.color, lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", textDecoration:task.done?"line-through":"none" }}>
                            {task.done && "✓ "}{task.text}
                          </div>
                          {height > 30 && (
                            <div style={{ fontSize:9, color:`${task.color}cc`, marginTop:1 }}>
                              {formatTime12(task.timeStart)}{task.timeEnd?" – "+formatTime12(task.timeEnd):""}
                              {task.repeat==="daily" && " · 🔁"}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Legend */}
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginTop:10 }}>
          {state.clients.map(c => (
            <div key={c.id} style={{ display:"flex", alignItems:"center", gap:4, fontSize:11, color:C.muted }}>
              <div style={{ width:8, height:8, borderRadius:2, background:c.color }}/>
              {c.name}
            </div>
          ))}
          <div style={{ display:"flex", alignItems:"center", gap:4, fontSize:11, color:C.muted }}>
            <div style={{ width:8, height:8, borderRadius:2, background:C.accent }}/>
            Personal
          </div>
        </div>
      </div>
    );
  }

  // ─── PRIORITY VIEW ────────────────────────────────────────────────────────
  function PriorityView({ state, update, getClientTasks, toggleClientTask, removeClientTask, togglePersonalTask, removePersonalTask, scheduleTask }) {
    const dragItem = useRef(null);
    const dragOverItem = useRef(null);
    const [draggingId, setDraggingId] = useState(null);
    const [overIdx, setOverIdx] = useState(null);

    const allTasks = [];
    state.clients.forEach(client => {
      getClientTasks(client.id).forEach(task => {
        allTasks.push({ ...task, source:"client", clientId:client.id, clientName:client.name, clientColor:client.color, uid:`${client.id}__${task.id}` });
      });
    });
    state.personalTasks.forEach(task => {
      allTasks.push({ ...task, source:"personal", uid:`personal__${task.id}` });
    });

    const order = state.priorityOrder || [];
    const orderedUids = order.filter(uid => allTasks.find(t => t.uid === uid));
    const unorderedTasks = allTasks.filter(t => !orderedUids.includes(t.uid));
    const finalUids = [...orderedUids, ...unorderedTasks.map(t => t.uid)];
    const sortedTasks = finalUids.map(uid => allTasks.find(t => t.uid === uid)).filter(Boolean);
    const pendingTasks = sortedTasks.filter(t => !t.done);
    const doneTasks = sortedTasks.filter(t => t.done);

    const handleDragStart = (e, idx, uid) => { dragItem.current=idx; setDraggingId(uid); e.dataTransfer.effectAllowed="move"; };
    const handleDragEnter = (e, idx) => { dragOverItem.current=idx; setOverIdx(idx); };
    const handleDragEnd = () => {
      const from=dragItem.current, to=dragOverItem.current;
      if (from===null||to===null||from===to) { dragItem.current=null; dragOverItem.current=null; setDraggingId(null); setOverIdx(null); return; }
      const newOrder=[...finalUids]; const [moved]=newOrder.splice(from,1); newOrder.splice(to,0,moved);
      update(prev=>({...prev,priorityOrder:newOrder}));
      dragItem.current=null; dragOverItem.current=null; setDraggingId(null); setOverIdx(null);
    };

    const getToggle = (t) => t.source==="client" ? ()=>toggleClientTask(t.clientId,t.id) : ()=>togglePersonalTask(t.id);
    const getRemove = (t) => t.source==="client" ? ()=>removeClientTask(t.clientId,t.id) : ()=>removePersonalTask(t.id);
    const donePct = sortedTasks.length ? Math.round(doneTasks.length/sortedTasks.length*100) : 0;

    return (
      <div className="slide-in">
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
          <div style={{ flex:1, height:5, background:C.surface2, borderRadius:99, overflow:"hidden" }}>
            <div style={{ width:`${donePct}%`, height:"100%", background:donePct===100?C.green:C.accent, borderRadius:99, transition:"width 0.4s" }}/>
          </div>
          <span style={{ fontSize:11, color:C.muted, flexShrink:0 }}>{doneTasks.length}/{sortedTasks.length} completadas</span>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 12px", marginBottom:12, background:"rgba(139,92,246,0.06)", borderRadius:8, border:`1px solid rgba(139,92,246,0.15)` }}>
          <span style={{ fontSize:16 }}>⠿</span>
          <span style={{ fontSize:11, color:C.muted2, lineHeight:1.5 }}>Arrastra para priorizar. Haz clic en 🕐 para programar fecha y hora.</span>
        </div>

        {pendingTasks.length === 0 && <div style={{ textAlign:"center", padding:"32px 0", color:C.muted, fontSize:13 }}>🎉 Todas las tareas completadas</div>}

        {pendingTasks.map((task, i) => {
          const globalIdx = finalUids.indexOf(task.uid);
          const isDragging = draggingId === task.uid;
          const isOver = overIdx === globalIdx;
          const color = task.source==="client" ? task.clientColor : C.accent;
          const hasSchedule = task.timeStart || task.date || task.repeat==="daily";
          return (
            <div key={task.uid}
              className={`drag-item${isDragging?" dragging":""}${isOver&&!isDragging?" drag-over":""}`}
              draggable onDragStart={e=>handleDragStart(e,globalIdx,task.uid)}
              onDragEnter={e=>handleDragEnter(e,globalIdx)} onDragOver={e=>e.preventDefault()} onDragEnd={handleDragEnd}
              style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", marginBottom:5, borderRadius:9, background:C.surface, border:`1px solid ${isDragging?"rgba(139,92,246,0.4)":C.border}`, cursor:"grab", userSelect:"none", borderLeft:`3px solid ${color}` }}>
              <div style={{ width:22, height:22, borderRadius:6, background:i===0?"rgba(139,92,246,0.2)":C.surface2, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, border:`1px solid ${i===0?"rgba(139,92,246,0.4)":C.border}` }}>
                <span style={{ fontSize:10, fontWeight:700, color:i===0?C.accent:C.muted }}>{i+1}</span>
              </div>
              <span style={{ fontSize:13, color:C.border2, flexShrink:0, cursor:"grab", letterSpacing:"-1px" }}>⠿</span>
              <button onClick={getToggle(task)} style={{ width:18,height:18,borderRadius:"50%",flexShrink:0,cursor:"pointer",border:`1.5px solid ${C.border2}`,background:"transparent",display:"flex",alignItems:"center",justifyContent:"center" }}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, color:C.text, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{task.text}</div>
                <div style={{ display:"flex", alignItems:"center", gap:5, marginTop:2, flexWrap:"wrap" }}>
                  <span style={{ fontSize:10, color:color }}>{task.source==="client"?task.clientName:"👤 Personal"}</span>
                  {task.repeat==="daily" && <span style={{ fontSize:9, padding:"1px 5px", borderRadius:99, background:"rgba(139,92,246,0.1)", color:C.accent }}>🔁 diario</span>}
                  {task.date && task.repeat!=="daily" && <span style={{ fontSize:10, color:C.muted }}>{formatDateShort(task.date)}</span>}
                  {task.timeStart && <span style={{ fontSize:10, color:color }}>{formatTime12(task.timeStart)}{task.timeEnd?" – "+formatTime12(task.timeEnd):""}</span>}
                </div>
              </div>
              <button onClick={()=>scheduleTask(task)} title="Programar horario"
                style={{ padding:"4px 8px", borderRadius:7, border:`1px solid ${hasSchedule?color:C.border}`, background:hasSchedule?`${color}15`:"transparent", color:hasSchedule?color:C.muted, cursor:"pointer", fontSize:11, flexShrink:0, whiteSpace:"nowrap" }}>
                {hasSchedule?"🕐 editar":"🕐 hora"}
              </button>
              <button onClick={getToggle(task)} style={{ padding:"3px 10px", borderRadius:6, border:`1px solid ${C.border}`, background:"transparent", color:C.muted, cursor:"pointer", fontSize:11, flexShrink:0 }}>Hecho</button>
              <button onClick={getRemove(task)} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15,padding:"0 2px",flexShrink:0 }}>×</button>
            </div>
          );
        })}

        {doneTasks.length > 0 && (
          <div style={{ marginTop:16 }}>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:C.muted, marginBottom:8, display:"flex", alignItems:"center", gap:8 }}>
              <span>Completadas</span>
              <div style={{ flex:1, height:1, background:C.border }}/>
            </div>
            {doneTasks.map(task => {
              const color = task.source==="client" ? task.clientColor : C.accent;
              return (
                <div key={task.uid} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px", marginBottom:4, borderRadius:9, background:"transparent", border:`1px solid ${C.border}`, borderLeft:`3px solid ${color}30`, opacity:0.55 }}>
                  <button onClick={getToggle(task)} style={{ width:18,height:18,borderRadius:"50%",flexShrink:0,cursor:"pointer",border:`1.5px solid ${color}`,background:color,display:"flex",alignItems:"center",justifyContent:"center" }}>
                    <span style={{ color:"#fff",fontSize:9,fontWeight:700 }}>✓</span>
                  </button>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, color:C.muted, textDecoration:"line-through", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{task.text}</div>
                    <div style={{ fontSize:10, color:`${color}80`, marginTop:1 }}>{task.source==="client"?task.clientName:"👤 Personal"}</div>
                  </div>
                  <button onClick={getRemove(task)} style={{ background:"transparent",border:"none",cursor:"pointer",color:C.muted,fontSize:15,padding:"0 2px" }}>×</button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ─── MAIN APP ─────────────────────────────────────────────────────────────
  function App() {
    const [state, setState] = useState(load);
    const [tab, setTab] = useState("today");
    const [taskView, setTaskView] = useState("clients"); // "clients" | "priority" | "calendar"
    const [oodaOpen, setOodaOpen] = useState(false);
    const [addingHabit, setAddingHabit] = useState(false);
    const [editingObj, setEditingObj] = useState(false);
    const [editingMicro, setEditingMicro] = useState(false);
    const [tempObj, setTempObj] = useState("");
    const [tempMicro, setTempMicro] = useState({ label:"", goal:"", earned:"" });
    const [newClientName, setNewClientName] = useState("");
    const [addingClient, setAddingClient] = useState(false);
    const [scheduleModalTask, setScheduleModalTask] = useState(null); // {task, source, clientId?}
    const addClientRef = useRef(null);
    useEffect(() => { if (addingClient) addClientRef.current?.focus({ preventScroll:true }); }, [addingClient]);

    const update = useCallback(fn => setState(prev => { const next=fn(prev); save(next); return next; }), []);

    const tk = todayKey();
    const log = state.dailyLogs[tk] || { done:[], ooda:{}, reflect1:"", reflect2:"" };
    const updateLog = patch => update(prev => ({
      ...prev,
      dailyLogs: { ...prev.dailyLogs, [tk]: { ...(prev.dailyLogs[tk]||{done:[],ooda:{},reflect1:"",reflect2:""}), ...patch } }
    }));
    const toggleHabit = id => updateLog({ done: log.done.includes(id) ? log.done.filter(x=>x!==id) : [...log.done, id] });

    const getClientTasks = id => state.clientTasks[id] || [];

    const addClientTask = (cid, text, schedule={}) => update(prev => ({
      ...prev,
      clientTasks: { ...prev.clientTasks, [cid]: [...(prev.clientTasks[cid]||[]), {id:Date.now(), text, done:false, carry:false, ...schedule}] }
    }));
    const toggleClientTask = (cid, tid) => update(prev => ({ ...prev, clientTasks: { ...prev.clientTasks, [cid]: (prev.clientTasks[cid]||[]).map(t=>t.id===tid?{...t,done:!t.done}:t) } }));
    const removeClientTask = (cid, tid) => update(prev => ({ ...prev, clientTasks: { ...prev.clientTasks, [cid]: (prev.clientTasks[cid]||[]).filter(t=>t.id!==tid) } }));
    const updateClientTask = (cid, tid, patch) => update(prev => ({ ...prev, clientTasks: { ...prev.clientTasks, [cid]: (prev.clientTasks[cid]||[]).map(t=>t.id===tid?{...t,...patch}:t) } }));

    const addClient = () => {
      if (!newClientName.trim()) return;
      const colors = ["#f59e0b","#06b6d4","#8b5cf6","#22c55e","#ef4444","#f97316","#ec4899"];
      update(prev => ({ ...prev, clients: [...prev.clients, {id:"c"+Date.now(), name:newClientName.trim(), color:colors[prev.clients.length%colors.length]}] }));
      setNewClientName(""); setAddingClient(false);
    };
    const removeClient = id => update(prev => { const ct={...prev.clientTasks}; delete ct[id]; return {...prev, clients:prev.clients.filter(c=>c.id!==id), clientTasks:ct}; });

    const addPersonalTask = (text, schedule={}) => update(prev => ({ ...prev, personalTasks: [...prev.personalTasks, {id:Date.now(), text, done:false, carry:false, ...schedule}] }));
    const togglePersonalTask = id => update(prev => ({ ...prev, personalTasks: prev.personalTasks.map(t=>t.id===id?{...t,done:!t.done}:t) }));
    const removePersonalTask = id => update(prev => ({ ...prev, personalTasks: prev.personalTasks.filter(t=>t.id!==id) }));
    const updatePersonalTask = (id, patch) => update(prev => ({ ...prev, personalTasks: prev.personalTasks.map(t=>t.id===id?{...t,...patch}:t) }));

    // Schedule modal handler
    const openScheduleModal = (task) => setScheduleModalTask(task);
    const saveSchedule = (patch) => {
      if (!scheduleModalTask) return;
      const t = scheduleModalTask;
      if (t.source === "client") updateClientTask(t.clientId, t.id, patch);
      else updatePersonalTask(t.id, patch);
      setScheduleModalTask(null);
    };

    const doneCount = log.done.length;
    const totalH = state.habits.length;
    const pct = totalH ? Math.round(doneCount/totalH*100) : 0;
    const microPct = Math.min(100, Math.round(state.micro.earned/state.micro.goal*100));
    const totalTasks = state.clients.reduce((s,c)=>s+getClientTasks(c.id).length,0) + state.personalTasks.length;
    const doneTasks = state.clients.reduce((s,c)=>s+getClientTasks(c.id).filter(t=>t.done).length,0) + state.personalTasks.filter(t=>t.done).length;

    const navItems = [
      { id:"today",    icon:"◈", label:"Hoy",      badge:`${pct}%` },
      { id:"tasks",    icon:"◧", label:"Tareas",   badge:totalTasks>0?`${doneTasks}/${totalTasks}`:null },
      { id:"progress", icon:"◆", label:"Progreso", badge:null },
      { id:"settings", icon:"◎", label:"Config",   badge:null },
    ];

    const Sidebar = () => (
      <div id="sidebar" style={{ width:200, flexShrink:0, background:C.sidebar, borderRight:`1px solid ${C.border}`, display:"flex", flexDirection:"column", height:"100vh", padding:"20px 12px", gap:0, overflow:"hidden" }}>
        <div id="sidebar-logo" style={{ marginBottom:24, paddingLeft:8 }}>
          <div style={{ fontSize:15, fontWeight:700, color:C.text, letterSpacing:"0.04em" }}>MI SISTEMA</div>
          <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>{new Date().toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"}).toUpperCase()}</div>
        </div>
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:9, padding:"10px 12px", marginBottom:16 }}>
          <div style={{ fontSize:10, color:C.muted, marginBottom:4, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Microobjetivo</div>
          <div style={{ fontSize:18, fontWeight:700, color:C.cyan, letterSpacing:"-0.02em", marginBottom:6 }}>${state.micro.earned.toLocaleString()}</div>
          <div style={{ height:4, background:C.surface2, borderRadius:99, overflow:"hidden", marginBottom:4 }}>
            <div style={{ width:`${microPct}%`, height:"100%", background:`linear-gradient(90deg,${C.cyan},#818cf8)`, borderRadius:99, transition:"width 0.5s" }}/>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:C.muted }}>
            <span>{microPct}% logrado</span>
            <span>${(state.micro.goal-state.micro.earned).toLocaleString()} restante</span>
          </div>
        </div>
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:9, padding:"10px 12px", marginBottom:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
            <div style={{ fontSize:10, color:C.muted, fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase" }}>Hábitos hoy</div>
            <span style={{ fontSize:11, color:pct===100?C.green:C.muted }}>{doneCount}/{totalH}</span>
          </div>
          <div style={{ height:4, background:C.surface2, borderRadius:99, overflow:"hidden" }}>
            <div style={{ width:`${pct}%`, height:"100%", background:pct===100?C.green:C.accent, borderRadius:99, transition:"width 0.3s" }}/>
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginTop:8 }}>
            {state.habits.map(h => {
              const done = log.done.includes(h.id);
              return (
                <button key={h.id} onClick={()=>toggleHabit(h.id)} title={h.name} style={{ width:28,height:28,borderRadius:7,border:`1px solid ${done?"rgba(139,92,246,0.5)":C.border}`,background:done?C.accentDim:"transparent",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}>
                  {h.icon}
                </button>
              );
            })}
          </div>
        </div>
        <div id="sidebar-nav" style={{ display:"flex", flexDirection:"column", gap:2 }}>
          {navItems.map(n => (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{ display:"flex",alignItems:"center",gap:9,padding:"9px 10px",borderRadius:8,border:"none",cursor:"pointer",textAlign:"left",transition:"all 0.15s",background:tab===n.id?C.accentDim:"transparent",color:tab===n.id?C.accent:C.muted2 }}>
              <span style={{ fontSize:13 }}>{n.icon}</span>
              <span style={{ fontSize:13,fontWeight:tab===n.id?600:400,flex:1 }}>{n.label}</span>
              {n.badge && <span style={{ fontSize:10,padding:"1px 6px",borderRadius:99,background:tab===n.id?C.accentDim:C.surface2,color:tab===n.id?C.accent:C.muted }}>{n.badge}</span>}
            </button>
          ))}
        </div>

            <p style={{ fontSize:12,color:C.muted,marginBottom:10 }}>Esto borrará todos tus datos guardados.</p>
            <button onClick={()=>{ if(window.confirm("¿Resetear todos los datos?")){ const d=defaultState(); save(d); setState(d); } }}
              style={{ fontSize:13,padding:"7px 14px",borderRadius:7,border:`1px solid rgba(239,68,68,0.3)`,background:"rgba(239,68,68,0.08)",color:"#ef4444",cursor:"pointer" }}>
              Resetear todos los datos
            </button>
          </div>
        </div>
      </div>
    );

    const tabTitles = { today:"Hoy", tasks:"Tareas", progress:"Progreso", settings:"Configuración" };

    return (
      <div id="layout" style={{ display:"flex", height:"100vh", background:C.bg, color:C.text }}>
        <Sidebar/>
        <div id="main" style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
          <div style={{ borderBottom:`1px solid ${C.border}`, padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0 }}>
            <div>
              <h1 style={{ fontSize:16,fontWeight:600,color:C.text,margin:0 }}>{tabTitles[tab]}</h1>
              <div style={{ fontSize:11,color:C.muted,marginTop:1 }}>{new Date().toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase()}</div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <div style={{ width:7,height:7,borderRadius:"50%",background:pct===100?C.green:C.accent,boxShadow:`0 0 7px ${pct===100?C.green:C.accent}` }}/>
              <span style={{ fontSize:11,color:C.muted }}>{pct}% hábitos completados</span>
            </div>
          </div>
          <div style={{ flex:1, overflowY:"auto", padding:"16px 24px" }}>
            {tab==="today"    && renderTodayTab()}
            {tab==="tasks"    && renderTasksTab()}
            {tab==="progress" && renderProgressTab()}
            {tab==="settings" && renderSettingsTab()}
          </div>
        </div>

        {/* Schedule Modal */}
        {scheduleModalTask && (
          <TaskScheduleModal
            task={scheduleModalTask}
            onSave={saveSchedule}
            onClose={()=>setScheduleModalTask(null)}/>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
